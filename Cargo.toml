[package]
name = "frogs"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
axum = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
# `sqlite` is a base feature, not optional/toggleable — every build always
# carries the SQLite driver (see `[features]` below for why). `postgres`
# remains the only opt-in sub-feature, added on top by that feature.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "chrono",
    "sqlite",
] }
# rustls (not native-tls/openssl) to stay consistent with the sqlx driver
# choice and avoid pulling in a second TLS stack — matters for binary size.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Serves the axum `Router` over TLS — `rustls`, not its default
# `tls-native-tls`, for the same reason every other TLS choice in this
# project is rustls: no OpenSSL/system-TLS dependency, keeps the
# single-static-binary promise intact. See docs/frogs-https-development.md.
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls"] }
# Selects one process-wide TLS crypto provider explicitly. rustls 0.23
# refuses to guess when a dependency graph this size ends up with more than
# one candidate compiled in (reqwest, axum-server, and sqlx's own
# rustls-tls features each pull rustls independently, and don't all agree
# on a default) — `ring` over `aws-lc-rs`: no C/cmake build toolchain
# required, consistent with this project's "just run it" priority.
# Installed once, at process startup — see `main`'s first line.
rustls = { version = "0.23", features = ["ring"] }
serde_yaml = "0.9"
# Already an indirect dependency via reqwest -> url; pulled in directly here
# so http::execute can percent-encode a templated value before it's spliced
# into a URL, instead of hand-rolling encoding logic for something this
# easy to get subtly wrong.
percent-encoding = "2"
# `default-features = false` + only the `cors` feature: `cors` itself pulls
# in zero extra crates (see its Cargo.toml — `cors = []`), and "0.6" matches
# the version `reqwest` already resolves this to transitively, so this stays
# one compiled copy rather than two. See docs/frogs-quick-wins.md.
tower-http = { version = "0.6", default-features = false, features = ["cors"] }
# Already present transitively (via axum/sqlx) at this same version — added
# directly so `endpoint::resolve`'s nested-many fan-out can name
# `stream::iter`/`StreamExt::buffer_unordered` explicitly rather than
# depending on another crate's feature unification to keep pulling it in.
# `std` (which also brings in `alloc`) is the only feature actually used;
# every other feature stays off deliberately, for binary size.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# MSSQL support (`mssql` feature, see `[features]` below) is architecturally
# different from every other driver: no sqlx adapter exists for SQL Server,
# so this is the one driver built on `tiberius` (the pure-Rust TDS protocol
# implementation) directly, pooled via `deadpool-tiberius`. `tds73` selects
# the modern TDS protocol revision (SQL Server 2008+, which is the only
# range worth supporting); `rustls` keeps the same all-rustls TLS posture as
# every other driver in this project (see `rustls`'s own dependency comment
# above) instead of pulling in native-tls/OpenSSL. `tiberius`'s own `tokio`
# feature is deliberately *not* enabled — confirmed against its Cargo.toml
# that it only gates SQL Browser named-instance discovery
# (`sql-browser-tokio`), which `deadpool-tiberius` doesn't use; it manages
# its own `tokio::net::TcpStream` directly instead.
tiberius = { version = "0.12.3", default-features = false, features = ["tds73", "rustls", "chrono"], optional = true }
deadpool-tiberius = { version = "0.1.9", default-features = false, features = ["rustls", "chrono", "tds73"], optional = true }
# Oracle support (`oracle` feature, see `[features]` below) is architecturally
# the same shape as MSSQL above: no sqlx adapter exists for Oracle either, so
# this is built on `oracle-rs` (a pure-Rust implementation of Oracle's TNS
# wire protocol — no OCI/Instant Client install required), pooled via
# `deadpool-oracle`. Oracle's own official `oracledb` crate was deliberately
# *not* used instead — confirmed via crates.io that as of this writing it has
# published only beta/yanked versions (latest `26.0.0-beta.3`,
# `max_stable_version: null`), too API-unstable for a first pass.
# `oracle-rs` pulls in its own `rustls` at "0.23" (`default-features = false`,
# features `["std", "tls12"]` — no bundled crypto-provider feature of its
# own), the *same* major version this project's own top-level `rustls`
# dependency above already pins — unlike `tiberius`'s `rustls 0.21` (which
# needed to coexist as a second copy alongside the process-wide `ring`
# install), Cargo unifies this into one shared `rustls` 0.23.x build, so
# `oracle-rs`'s own TLS code path (unused by default — see `oracle::OracleDriver::connect`'s
# own doc comment for why this driver connects in plaintext by default) rides
# on the same single `ring` `CryptoProvider` `main`'s first line already
# installs, with no second provider to conflict.
oracle-rs = { version = "0.1.7", optional = true }
deadpool-oracle = { version = "0.1.1", optional = true }

[dev-dependencies]
# Generates a self-signed cert + key entirely in-memory at test time — no
# committed cert fixtures, no external tool (mkcert) needed in CI. See
# docs/frogs-https-development.md's "Automated/integration tests" section.
rcgen = "0.13"

[features]
default = ["postgres"]
# SQLite is always compiled in (see `sqlx`'s own dependency entry above) —
# no build of this binary lacks it, `--no-default-features` included. The
# only remaining compile-time choice is whether Postgres support is *also*
# built in; a future pass is expected to drop this distinction entirely and
# always build every driver (see docs/frogs-quick-wins.md's history for
# context), but for now `postgres` stays an explicit opt-in on top of the
# SQLite baseline, same as the design doc's "server-full" build already
# meant "both."
postgres = ["sqlx/postgres", "sqlx/tls-rustls"]
# Opt-in, same all-rustls TLS posture as `postgres` above.
mysql = ["sqlx/mysql", "sqlx/tls-rustls"]
# Opt-in, not in `default` — pulls in `tiberius`/`deadpool-tiberius` instead
# of an sqlx adapter (see those dependencies' own comment above for why).
mssql = ["dep:tiberius", "dep:deadpool-tiberius"]
# Opt-in, not in `default` — pulls in `oracle-rs`/`deadpool-oracle` instead of
# an sqlx adapter (see those dependencies' own comment above for why).
oracle = ["dep:oracle-rs", "dep:deadpool-oracle"]

[profile.release]
opt-level = "z"     # optimize for size over speed
lto = true          # whole-program dead-code elimination across crates
codegen-units = 1    # more optimization opportunity at the cost of build time
strip = true         # drop debug symbols from the final binary
