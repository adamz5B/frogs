name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '**.txt'
  pull_request:
    paths-ignore:
      - '**.md'
      - '**.txt'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Default features only — sqlite is always compiled in regardless (a base
  # feature, not optional; see Cargo.toml's `[features]` block), and
  # postgres is on by default, so a plain `cargo build`/`cargo test` here
  # already exercises the full package (both drivers) on each OS.
  # Per-driver-combination legs were dropped since every driver's own logic
  # is already covered by `sql::postgres`/`sql::sqlite`'s own unit tests
  # regardless of which combination of features a given binary is built
  # with; what's worth CI's time is proving the full package builds and
  # passes on each OS.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

  # A real Postgres instance, exercised via the one `#[ignore]`d live-DB
  # test in src/sql/postgres.rs — Postgres service containers are a
  # Linux-runner-only GitHub Actions feature, hence its own job rather
  # than folded into the `test` matrix above.
  postgres-integration:
    name: postgres integration test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run the live-Postgres test
        env:
          DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/postgres
        run: cargo test --locked --features postgres -- --ignored

  # A real MySQL instance, exercised via the `#[ignore]`d live-DB tests in
  # src/sql/mysql.rs — same Linux-runner-only service-container reasoning as
  # `postgres-integration` above. MySQL and MariaDB speak the same wire
  # protocol as far as sqlx's MySQL driver is concerned, so this one job is
  # meant to cover both; a dedicated MariaDB job is deferred unless a real
  # compatibility gap between the two ever surfaces.
  #
  # `--no-default-features` matters here: `postgres` is a *default* feature,
  # so a plain `--features mysql` would compile the Postgres driver (and its
  # own `#[ignore]`d tests) into this same binary too — and `-- --ignored`
  # runs every ignored test it finds, not just this job's own, so Postgres's
  # live tests would fail here with no `DATABASE_URL_TEST` set/no Postgres
  # container running (exactly what happened before this was added).
  mysql-integration:
    name: mysql integration test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: frogs
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -pmysql"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run the live-MySQL test
        env:
          DATABASE_URL_TEST_MYSQL: mysql://root:mysql@localhost:3306/frogs
        run: cargo test --locked --no-default-features --features mysql -- --ignored

  # A real SQL Server instance, exercised via the `#[ignore]`d live-DB tests
  # in src/sql/mssql.rs. Runs on ubuntu-latest against Microsoft's official
  # Linux SQL Server image as a `services:` container — same pattern as
  # `postgres-integration`/`mysql-integration` above. This used to run on
  # windows-latest via the `mssqlsuite` action (Chocolatey-installing a full
  # SQL Server engine directly on the runner), but that install alone took
  # ~13 wall-clock minutes, and Windows runners are billed at a 2x minute
  # multiplier on top of that — the driver's own test code just opens a TCP
  # connection via `MSSQL_TEST_*` env vars, nothing Windows-specific, so
  # there's no reason to pay for a Windows runner here at all. Note this
  # means `mssql` no longer gets its build exercised on a non-Linux OS by
  # any CI job (the base `test` matrix builds default features only).
  #
  # `-C` on the sqlcmd health check trusts the container's self-signed dev
  # cert, since mssql-tools18 (bundled from the 2022 image onward) refuses
  # an untrusted server cert by default.
  #
  # `--no-default-features` for the same reason `mysql-integration` above
  # needs it: without it, `--features mssql` would also compile the default
  # `postgres` feature into this binary, and `-- --ignored` would then also
  # run Postgres's own live-DB tests here, which have no Postgres instance
  # to reach on this runner.
  mssql-integration:
    name: mssql integration test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: FrogsTestPassw0rd123
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $MSSQL_SA_PASSWORD -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run the live-MSSQL test
        env:
          MSSQL_TEST_HOST: localhost
          MSSQL_TEST_PORT: 1433
          MSSQL_TEST_DATABASE: master
          MSSQL_TEST_USER: sa
          MSSQL_TEST_PASSWORD: FrogsTestPassw0rd123
        run: cargo test --locked --no-default-features --features mssql -- --ignored

  # A real Oracle instance, exercised via the `#[ignore]`d live-DB tests in
  # src/sql/oracle.rs — same Linux-runner-only service-container reasoning as
  # `postgres-integration`/`mysql-integration`/`mssql-integration` above.
  # Oracle's own official images have no lightweight, freely-redistributable
  # tag suited to a public CI runner, but `gvenzl/oracle-free` (community-
  # maintained, no Oracle account/login needed to pull) does — it's the same
  # image this driver's live tests were originally verified against locally,
  # and it ships a real `healthcheck.sh` specifically designed for exactly
  # this "wait until genuinely ready to accept connections" use in CI/compose
  # setups (not just "is the port open"). The `slim-faststart` tag trims
  # first-boot time specifically for throwaway CI containers like this one.
  #
  # `ORACLE_PASSWORD` sets both the `sys` and `system` accounts' password;
  # this driver's own default test user is `system` (see `oracle.rs`'s
  # `ORACLE_TEST_USER` default), and `FREEPDB1` is this image's own default
  # pluggable-database service name — matches what the local Multipass-VM
  # live verification already used, so no `ORACLE_TEST_SERVICE_NAME`/`_USER`
  # override is needed here.
  #
  # `--no-default-features` for the same reason `mysql-integration`/
  # `mssql-integration` above need it: without it, `--features oracle` would
  # also compile the default `postgres` feature into this binary, and
  # `-- --ignored` would then also run Postgres's own live-DB tests here,
  # which have no Postgres instance to reach on this runner.
  oracle-integration:
    name: oracle integration test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_PASSWORD: FrogsTestPassw0rd123
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run the live-Oracle test
        env:
          ORACLE_TEST_HOST: localhost
          ORACLE_TEST_PORT: 1521
          ORACLE_TEST_SERVICE_NAME: FREEPDB1
          ORACLE_TEST_USER: system
          ORACLE_TEST_PASSWORD: FrogsTestPassw0rd123
        run: cargo test --locked --no-default-features --features oracle -- --ignored

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  # Advisory only, not blocking: this codebase predates `rustfmt.toml`
  # (added alongside this workflow) and isn't fully compliant with it yet
  # — bringing it into compliance is a large, purely-cosmetic reformatting
  # pass that deserves its own deliberate commit, not a side effect of
  # setting up CI. Remove `continue-on-error` once that pass has landed.
  fmt:
    name: fmt (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - run: cargo fmt --check
